# UK PRA IRRBB: PRA Rulebook, Internal Capital Adequacy Assessment (ICAA) Part, chapter 9, and
# Supervisory Statement SS31/15 (ICAAP and SREP).
# Sources: https://www.prarulebook.co.uk/pra-rules/internal-capital-adequacy-assessment and
#          https://www.bankofengland.co.uk/prudential-regulation/publication/2013/the-internal-capital-adequacy-assessment-process-and-supervisory-review-ss
# Verified against the 12/11/2026 view on 2026-11-12 (rule 9.11 Table 1 dated 01/07/2026).
# SS31/15 items are supervisory expectations ("should"), not binding rules. Versions taking
# effect after 01/01/2027 were NOT reviewed. Validated by riskplatform.config.IrrbbRules.

regime: pra
name: UK PRA (ICAA Part 9, SS31/15)

shocks:
  scenarios: [parallel_up, parallel_down, steepener, flattener, short_up, short_down]
  scenarios_ref: "ICAA 9.7"
  sizes_ref: "ICAA 9.11 Table 1 (01/07/2026)"
  sizes_bp:
    GBP: {parallel: 275, short: 425, long: 250}
    EUR: {parallel: 225, short: 350, long: 200}
    USD: {parallel: 200, short: 300, long: 225}
  decay_years: {value: 4, ref: "ICAA 9.9, 9.10"}
  steepener: {short: -0.65, long: 0.90, ref: "ICAA 9.10"}
  flattener: {short: 0.80, long: -0.60, ref: "ICAA 9.10"}
  floor:
    applied: true
    start_bp: -100  # for immediate maturities
    zero_at_years: 20  # rising in a straight line to 0% at 20 years and beyond
    ref: "SS31/15 2.9B(iii)"
    assumption: "the floor rises linearly (5 bp a year); where observed rates are below the floor, they are kept"

aggregation:
  gains_weight: 0.5  # losses and gains are added, gains weighted by 50%
  ref: "SS31/15 2.9B(iv)"

outlier_threshold:
  {value: 0.15, ref: "ICAA 9.4A, SS31/15 2.7B",
   assumption: "CET1 + AT1 is taken as the group's implied equity; breaching it means notifying the PRA"}

buckets_ref: "ICAA 9.13-9.15 (standardised framework, as SRP31.96 Table 3)"
buckets:
  - {label: overnight, up_to_years: 0.0028, midpoint_years: 0.0028}
  - {label: O/N-1M, up_to_years: 0.0833, midpoint_years: 0.0417}
  - {label: 1M-3M, up_to_years: 0.25, midpoint_years: 0.1667}
  - {label: 3M-6M, up_to_years: 0.5, midpoint_years: 0.375}
  - {label: 6M-9M, up_to_years: 0.75, midpoint_years: 0.625}
  - {label: 9M-1Y, up_to_years: 1.0, midpoint_years: 0.875}
  - {label: 1Y-1.5Y, up_to_years: 1.5, midpoint_years: 1.25}
  - {label: 1.5Y-2Y, up_to_years: 2.0, midpoint_years: 1.75}
  - {label: 2Y-3Y, up_to_years: 3.0, midpoint_years: 2.5}
  - {label: 3Y-4Y, up_to_years: 4.0, midpoint_years: 3.5}
  - {label: 4Y-5Y, up_to_years: 5.0, midpoint_years: 4.5}
  - {label: 5Y-6Y, up_to_years: 6.0, midpoint_years: 5.5}
  - {label: 6Y-7Y, up_to_years: 7.0, midpoint_years: 6.5}
  - {label: 7Y-8Y, up_to_years: 8.0, midpoint_years: 7.5}
  - {label: 8Y-9Y, up_to_years: 9.0, midpoint_years: 8.5}
  - {label: 9Y-10Y, up_to_years: 10.0, midpoint_years: 9.5}
  - {label: 10Y-15Y, up_to_years: 15.0, midpoint_years: 12.5}
  - {label: 15Y-20Y, up_to_years: 20.0, midpoint_years: 17.5}
  - {label: over 20Y, midpoint_years: 25.0}

nmd:
  caps_ref: "ICAA 9.36 Table 3"
  caps:
    retail_transactional: {core_max: 0.90, years_max: 5.0}
    retail_non_transactional: {core_max: 0.70, years_max: 4.5}
    wholesale: {core_max: 0.50, years_max: 4.0}
  max_average_years: 5.0  # per currency, retail and non-financial wholesale (SS31/15 2.9B(vi))
  categories:
    retail_stable_deposits:
      {type: retail_transactional, core_share: 0.70, core_years: 4.0,
       assumption: "stable retail deposits treated as transactional; core share and maturity are judgement"}
    retail_less_stable_deposits:
      {type: retail_non_transactional, core_share: 0.50, core_years: 3.0,
       assumption: "less stable retail deposits treated as non-transactional; core share and maturity are judgement"}

nii:
  scenarios: [parallel_up, parallel_down]
  horizon_months: 12
  ref: "SS31/15 2.9C"
  assumption: "the UK sets no NII outlier test or scenarios; parallel up and down over 12 months with a constant balance sheet are used, consistent with the Basel file"

# Derivatives: a swap reprices as two legs. Pay-fixed: the fixed leg is paid until maturity
# (-notional at maturity) and the floating leg is received until its next reset
# (+notional at the reset). Notional only; no credit or collateral effects.
derivatives:
  interest_rate_swaps:
    direction: pay_fixed
    floating_reset_days: 90
    ref: "ICAA 9.13-9.15 (standardised framework)"
    assumption: "3-month floating leg; the next reset is taken as one full period away (the reset date is not in the data)"
